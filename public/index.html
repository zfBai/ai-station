<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mlChat</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e6e8ec; --muted:#8b93a1; --accent:#4a9eff; --accent2:#2d6fbf;
  --danger:#ff5c5c; --ok:#3ecf8e; --warn:#f0b429;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; cursor:pointer; border:none; border-radius:8px; transition:.15s}
button:disabled{opacity:.5; cursor:not-allowed}
input,textarea{font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; outline:none; transition:.15s}
input:focus,textarea:focus{border-color:var(--accent)}
.btn-primary{background:var(--accent); color:#fff; padding:10px 18px; font-weight:600}
.btn-primary:hover:not(:disabled){background:#5aa9ff}
.btn-ghost{background:transparent; color:var(--muted); padding:8px 14px; border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text); border-color:#3a4150}
.btn-danger{background:transparent; color:var(--danger); border:1px solid #4a2b2b; padding:6px 12px; font-size:13px}
.btn-danger:hover{background:#2a1717}
.muted{color:var(--muted)}
.hidden{display:none !important}

/* ---------- 顶栏 ---------- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:12px 18px;
  border-bottom:1px solid var(--border); background:var(--panel);
}
header .logo{
  display:flex; align-items:baseline; line-height:1;
  font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  font-size:19px; font-weight:700; letter-spacing:-.4px;
  user-select:none;
}
header .logo span{
  margin-left:1px; font-weight:600; letter-spacing:-.2px;
  color:var(--accent);                       /* 兜底：不支持渐变裁剪时就是个纯蓝的 Chat */
}
@supports ((-webkit-background-clip:text) or (background-clip:text)) {
  header .logo span{
    background:linear-gradient(118deg,#8ccbff 0%,var(--accent) 55%,#3f7fd6 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
}
header .spacer{flex:1}
header .badge{font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:99px; padding:3px 10px}
/* 顶栏中区：到期时刻 + 剩余时间；窄屏藏掉到期时刻防挤 */
header .head-center{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); white-space:nowrap}
header .head-center .head-sep{opacity:.45}
header .head-center .warn{color:var(--warn)}
@media (max-width:640px){ header .head-center .head-time, header .head-center .head-sep{display:none} }

/* ---------- 通用视图容器 ---------- */
.view{flex:1; min-height:0; display:flex; flex-direction:column}

/* ---------- 1. 令牌闸门 ---------- */
#gateView{align-items:center; justify-content:center; padding:24px; overflow-y:auto}
.gate-card{width:100%; max-width:400px; text-align:center}
.gate-card h1{margin:0 0 6px; font-size:22px}
.gate-card p{margin:0 0 24px; color:var(--muted); font-size:14px}
.token-input{
  width:100%; text-align:center; letter-spacing:3px; font-size:20px; font-weight:600;
  padding:14px; font-family:ui-monospace,Consolas,monospace; text-transform:uppercase;
}
.gate-actions{display:flex; gap:10px; margin-top:14px}
.gate-actions button{flex:1}
.gate-foot{margin-top:26px; font-size:13px}
.gate-foot a{color:var(--muted); text-decoration:none; cursor:pointer}
.gate-foot a:hover{color:var(--accent)}
#gateError{margin-top:14px; color:var(--danger); font-size:14px; min-height:20px}

/* ---------- 2. 聊天 ---------- */
#chatView{display:none}
#chatView.on{display:flex}
/* 聊天窗口标签栏：一个标签 = 一个独立会话，横向排开，多了可滚 */
.tabs{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:9px 18px; border-bottom:1px solid var(--border); background:var(--panel)}
.tabs-inner{flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; display:flex; align-items:center; gap:4px; max-width:180px; padding:6px 6px 6px 12px; border:1px solid transparent; border-radius:8px; color:var(--muted); font-size:13px; cursor:pointer; user-select:none; transition:.15s}
.tab:hover{background:var(--panel2); color:var(--text)}
.tab.on{background:var(--panel2); border-color:var(--border); color:var(--text)}
.tab .tab-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tab .tab-x{flex:0 0 auto; width:19px; height:19px; padding:0; display:grid; place-items:center; background:transparent; color:var(--muted); font-size:15px; line-height:1; border-radius:5px; transition:.15s}
.tab .tab-x:hover{background:#2f1d1d; color:var(--danger)}
.tab-new{flex:0 0 auto; height:30px; padding:0 12px; display:grid; place-items:center; background:transparent; color:var(--muted); border:1px dashed var(--border); border-radius:8px; font-size:13px; transition:.15s}
.tab-new:hover:not(:disabled){color:var(--text); border-color:#3a4150}
#messages{flex:1; min-height:0; overflow-y:auto; padding:22px 18px 8px}
.msg{max-width:760px; margin:0 auto 16px; display:flex; gap:10px}
.msg .who{
  flex:0 0 auto; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  font-size:12px; font-weight:700; background:var(--panel2); border:1px solid var(--border); color:var(--muted);
}
.msg.user .who{background:var(--accent2); border-color:var(--accent); color:#fff}
.msg .body{flex:1; min-width:0; overflow-wrap:break-word; word-break:break-word; padding-top:3px}
.msg.user .body{color:#dfe6f0}
.msg.assistant .body{color:var(--text)}
.msg .body .cursor{display:inline-block; width:7px; height:15px; background:var(--accent); vertical-align:-2px; animation:blink 1s steps(2) infinite}

/* ---------- 2.1 Markdown / LaTeX 渲染样式 ---------- */
.msg .body > :first-child{margin-top:0}
.msg .body > :last-child{margin-bottom:0}
.msg .body p{margin:.55em 0}
.msg .body h1,.msg .body h2,.msg .body h3,.msg .body h4,.msg .body h5,.msg .body h6{margin:.75em 0 .4em; line-height:1.35; font-weight:700}
.msg .body h1{font-size:1.4em}
.msg .body h2{font-size:1.22em}
.msg .body h3{font-size:1.08em}
.msg .body h4,.msg .body h5,.msg .body h6{font-size:1em}
.msg .body ul,.msg .body ol{margin:.55em 0; padding-left:1.5em}
.msg .body li{margin:.22em 0}
.msg .body li > p{margin:.2em 0}
.msg .body a{color:var(--accent); text-decoration:none}
.msg .body a:hover{text-decoration:underline}
.msg .body code{font-family:ui-monospace,Consolas,"Courier New",monospace; font-size:.9em; background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:1px 5px}
.msg .body pre{margin:.6em 0; padding:11px 13px; background:var(--panel2); border:1px solid var(--border); border-radius:9px; overflow-x:auto}
.msg .body pre code{display:block; padding:0; border:none; background:none; font-size:.88em; line-height:1.6}
.msg .body blockquote{margin:.55em 0; padding:.1em 0 .1em 12px; border-left:3px solid var(--border); color:var(--muted)}
.msg .body table{display:block; max-width:100%; overflow-x:auto; border-collapse:collapse; margin:.6em 0}
.msg .body th,.msg .body td{border:1px solid var(--border); padding:5px 11px; font-size:.93em}
.msg .body th{background:var(--panel2); font-weight:600}
.msg .body hr{margin:.9em 0; border:none; border-top:1px solid var(--border)}
.msg .body img{max-width:100%; border-radius:8px}
.msg .body .katex{font-size:1.05em}
.msg .body .katex-display{margin:.6em 0; padding:2px 0; overflow-x:auto; overflow-y:hidden}
.msg .body .katex-display::-webkit-scrollbar{height:6px}
.msg .body .katex-display::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px}
.msg .body code.math-err{color:var(--danger)}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.msg.err .body{color:var(--danger)}
.chat-foot{flex:0 0 auto; border-top:1px solid var(--border); background:var(--panel); padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.chat-inner{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end}
#chatInput{flex:1; resize:none; max-height:180px; min-height:44px; line-height:1.5; padding:11px 14px}
#sendBtn{flex:0 0 auto; height:44px; padding:0 20px}

/* ---------- 3. 管理面板 ---------- */
#adminView{display:none; overflow-y:auto; padding:24px 18px 60px}
#adminView.on{display:block}
.admin-wrap{max-width:820px; margin:0 auto}
.card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:18px}
.card h2{margin:0 0 4px; font-size:17px}
.card .sub{margin:0 0 16px; color:var(--muted); font-size:13px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:13px; color:var(--muted)}
.field input,.field select{padding:9px 12px}
.field.grow{flex:1; min-width:180px}
select{font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; outline:none}
.new-token{
  margin-top:16px; padding:16px; background:#101a26; border:1px solid var(--accent2); border-radius:10px;
}
.new-token .lbl{font-size:13px; color:var(--accent); margin-bottom:8px}
.new-token .code{
  font-family:ui-monospace,Consolas,monospace; font-size:19px; font-weight:700; letter-spacing:1.5px;
  word-break:break-all; margin-bottom:12px;
}
.tok-list{display:flex; flex-direction:column; gap:10px}
.tok{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px 14px; background:var(--panel2); border:1px solid var(--border); border-radius:10px;
}
.tok .code{font-family:ui-monospace,Consolas,monospace; font-size:14px; letter-spacing:.5px}
.tok .meta{flex:1; min-width:140px; font-size:12px; color:var(--muted)}
.tok .meta b{color:var(--text); font-weight:600}
.empty{color:var(--muted); font-size:14px; padding:12px 0}
#toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
  background:#22262f; border:1px solid var(--border); color:var(--text);
  padding:11px 20px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none;
  transition:.25s; z-index:99; box-shadow:0 8px 30px rgba(0,0,0,.4);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>

</head>
<body>

<header>
  <div class="logo">ml<span>Chat</span></div>
  <div class="spacer"></div>
  <div class="head-center hidden" id="headCenter">
    <span class="head-time" id="headTime"></span>
    <span class="head-sep">·</span>
    <span id="headLeft"></span>
  </div>
  <div class="spacer"></div>
  <button class="btn-ghost hidden" id="logoutBtn">退出</button>
  <div class="badge hidden" id="userBadge"></div>
</header>

<!-- ============ 1. 输令牌 ============ -->
<div class="view" id="gateView">
  <div class="gate-card">
    <h1>输入访问令牌</h1>
    <p>向站点主人要一串 24 小时有效的令牌</p>
    <input class="token-input" id="tokenInput" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" autocomplete="off" spellcheck="false">
    <div class="gate-actions">
      <button class="btn-primary" id="enterBtn">进入</button>
    </div>
    <div id="gateError"></div>
    <div class="gate-foot">
      <a id="adminLink">我是管理员 →</a>
    </div>

    <div class="hidden" id="adminLogin" style="margin-top:20px; text-align:left">
      <div class="row">
        <div class="field grow"><label>用户名</label><input id="adminUser" placeholder="图片保存站的账号" autocomplete="username"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="field grow"><label>密码</label><input id="adminPass" type="password" placeholder="密码" autocomplete="current-password"></div>
      </div>
      <div class="gate-actions">
        <button class="btn-primary" id="adminLoginBtn">登录管理</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 2. 聊天 ============ -->
<div class="view" id="chatView">
  <div class="tabs">
    <div class="tabs-inner" id="tabsInner"></div>
    <button class="tab-new" id="newChatBtn" title="新建聊天窗口">＋ 新窗口</button>
  </div>
  <div id="messages"></div>
  <div class="chat-foot">
    <div class="chat-inner">
      <textarea id="chatInput" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button class="btn-primary" id="sendBtn">发送</button>
    </div>
  </div>
</div>

<!-- ============ 3. 管理面板 ============ -->
<div class="view" id="adminView">
  <div class="admin-wrap">
    <div class="card">
      <h2>创建临时令牌</h2>
      <p class="sub">生成后把令牌发给朋友，到期或你手动关闭后立刻失效。</p>
      <div class="row">
        <div class="field grow"><label>备注（给谁用的，可留空）</label><input id="newLabel" placeholder="例如：小王" maxlength="40"></div>
        <div class="field"><label>有效期</label>
          <select id="newHours">
            <option value="1">1 小时</option>
            <option value="6">6 小时</option>
            <option value="12">12 小时</option>
            <option value="24" selected>24 小时</option>
            <option value="72">3 天</option>
            <option value="168">7 天</option>
          </select>
        </div>
        <button class="btn-primary" id="createBtn">创建</button>
      </div>
      <div class="new-token hidden" id="newTokenBox">
        <div class="lbl">✅ 令牌已创建，现在复制发给朋友（随时可以在这里撤销）</div>
        <div class="code" id="newTokenCode"></div>
        <div class="row">
          <button class="btn-primary" id="copyNewBtn">复制令牌</button>
          <button class="btn-ghost" id="copyLinkBtn">复制邀请链接</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>当前有效的令牌</h2>
      <p class="sub" id="tokSub">加载中…</p>
      <div class="tok-list" id="tokList"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn-ghost" id="refreshBtn">刷新</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="render.js"></script>
<script>
// ============================================================================
// 前端：三种状态 —— 输令牌 / 聊天 / 管理面板
// 所有请求都发给本站，DeepSeek 的 key 只在服务端，这里从头到尾碰不到。
// ============================================================================
const $ = id => document.getElementById(id)
const BASE = location.pathname.replace(/\/+$/, '')

const state = {
  token: '',          // 访客令牌（已确认有效）
  label: '',
  expiresAt: 0,
  adminUser: '',
  adminPass: '',
  sessions: [],       // 所有聊天窗口：[{ id, msgs: [{ role, content }] }]
  activeId: '',       // 当前窗口的 id
  msgs: [],           // 直接指向当前窗口的 msgs，发送/渲染都读写它
  busy: false,
}

// ---------- 小工具 ----------
let toastTimer = null
function toast(msg) {
  const t = $('toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600)
}
function fmtLeft(ms) {
  if (ms <= 0) return '已过期'
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000)
  return h > 0 ? `${h} 小时 ${m} 分` : `${m} 分钟`
}
function fmtTime(ts) {
  if (!ts) return '—'
  const d = new Date(ts)
  const p = n => String(n).padStart(2, '0')
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text)
    toast('已复制到剪贴板')
  } catch {
    // 非 HTTPS 或旧浏览器拿不到 clipboard API，退回到老办法
    const ta = document.createElement('textarea')
    ta.value = text; document.body.appendChild(ta); ta.select()
    try { document.execCommand('copy'); toast('已复制到剪贴板') } catch { toast('复制失败，请手动选中') }
    ta.remove()
  }
}

// ---------- 统一请求 ----------
async function api(path, { method = 'GET', headers = {}, body } = {}) {
  const h = { ...headers }
  if (body !== undefined) h['Content-Type'] = 'application/json'
  const res = await fetch(BASE + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || `请求失败 (${res.status})`)
  return data
}

// ---------- 视图切换 ----------
function showView(which) {
  $('gateView').style.display = which === 'gate' ? 'flex' : 'none'
  $('chatView').classList.toggle('on', which === 'chat')
  $('adminView').classList.toggle('on', which === 'admin')
}

// ============================================================================
// 一、访客：输令牌进场
// ============================================================================
$('tokenInput').addEventListener('input', e => {
  // 边输边格式化成 XXXX-XXXX-XXXX-XXXX，用户怎么打（带不带横线、大小写）都能对上
  const raw = e.target.value.toUpperCase().replace(/[^A-Z2-9]/g, '').slice(0, 16)
  e.target.value = (raw.match(/.{1,4}/g) || []).join('-')
})
$('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') enterChat() })
$('enterBtn').addEventListener('click', enterChat)

async function enterChat() {
  const token = $('tokenInput').value.replace(/[^A-Z2-9]/g, '')
  $('gateError').textContent = ''
  if (token.length !== 16) return ($('gateError').textContent = '令牌是 16 位字符，请检查是否输漏了')
  $('enterBtn').disabled = true
  try {
    const info = await api('/api/session', { method: 'POST', headers: { 'x-ai-token': token } })
    state.token = token
    state.label = info.label || ''
    state.expiresAt = info.expiresAt
    loadSessions()
    refreshHeader()
    showView('chat')
    $('chatInput').focus()
  } catch (e) {
    $('gateError').textContent = e.message
  } finally {
    $('enterBtn').disabled = false
  }
}

// ---------- 聊天窗口：多个会话互不干扰，按令牌存在本机 ----------
const welcome = () => ({ role: 'assistant', content: '你好，有什么可以帮你的？' })
const newSessionId = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7)

// 存档里的消息只信任 role/content 两个字段，坏数据当场丢掉
function normalizeMsgs(raw) {
  if (!Array.isArray(raw)) return []
  const out = []
  for (const m of raw) {
    if (!m || typeof m.content !== 'string') continue
    out.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })
  }
  return out
}

function loadSessions() {
  let data = null
  try { data = JSON.parse(localStorage.getItem('ai_sessions_' + state.token) || 'null') } catch {}
  const list = []
  for (const s of (data && Array.isArray(data.list) ? data.list : [])) {
    if (!s || typeof s.id !== 'string') continue
    const msgs = normalizeMsgs(s.msgs)
    list.push({ id: s.id, msgs: msgs.length ? msgs : [welcome()] })
  }
  if (!list.length) {
    // 老版本只存一个会话（键名 ai_msgs_{token}）：把旧记录搬进第一个窗口
    let old = []
    try { old = normalizeMsgs(JSON.parse(localStorage.getItem('ai_msgs_' + state.token) || '[]')) } catch {}
    list.push({ id: newSessionId(), msgs: old.length ? old : [welcome()] })
  }
  state.sessions = list
  activate(list.find(s => s.id === data?.active) || list[0], false)
}

function saveSessions() {
  if (!state.token || !state.sessions.length) return
  try {
    const list = state.sessions.map(s => ({ id: s.id, msgs: s.msgs.slice(-60) }))
    localStorage.setItem('ai_sessions_' + state.token, JSON.stringify({ active: state.activeId, list }))
  } catch {}
}

// 切到某个窗口：state.msgs 改成指向它的消息数组
function activate(sess, save = true) {
  state.activeId = sess.id
  state.msgs = sess.msgs
  renderTabs()
  renderMsgs()
  if (save) saveSessions()
}

// 标签文字取第一条提问，够一眼认出是哪个话题
function sessionTitle(s) {
  const first = s.msgs.find(m => m.role === 'user')
  if (!first) return '新对话'
  const t = String(first.content).replace(/\s+/g, ' ').trim()
  return t.length > 12 ? t.slice(0, 12) + '…' : t
}

function renderTabs() {
  const box = $('tabsInner')
  box.innerHTML = ''
  for (const s of state.sessions) {
    const tab = document.createElement('div')
    tab.className = 'tab' + (s.id === state.activeId ? ' on' : '')
    tab.title = sessionTitle(s)
    const name = document.createElement('span')
    name.className = 'tab-name'
    name.textContent = sessionTitle(s)
    const x = document.createElement('button')
    x.className = 'tab-x'
    x.textContent = '×'
    x.title = '删除这个聊天窗口'
    x.onclick = ev => { ev.stopPropagation(); closeSession(s.id) }
    tab.appendChild(name); tab.appendChild(x)
    tab.onclick = () => switchSession(s.id)
    box.appendChild(tab)
  }
  const on = box.querySelector('.tab.on')
  if (on) { try { on.scrollIntoView({ block: 'nearest', inline: 'nearest' }) } catch { on.scrollIntoView(false) } }
}

function switchSession(id) {
  if (id === state.activeId) return
  if (state.busy) return toast('等这条回复完再切换窗口')
  const s = state.sessions.find(v => v.id === id)
  if (s) activate(s)
}

function createSession() {
  if (state.busy) return toast('等这条回复完再新建窗口')
  const s = { id: newSessionId(), msgs: [welcome()] }
  state.sessions.push(s)
  activate(s)
  $('chatInput').focus()
}

function closeSession(id) {
  if (state.busy) return toast('等这条回复完再删除窗口')
  const idx = state.sessions.findIndex(s => s.id === id)
  if (idx < 0) return
  const s = state.sessions[idx]
  const used = s.msgs.some(m => m.role === 'user')   // 只有欢迎语的空窗口直接关，不弹确认
  if (used && !confirm(`确定删除「${sessionTitle(s)}」这个聊天窗口吗？\n窗口里的聊天记录会一起删掉。`)) return
  state.sessions.splice(idx, 1)
  if (!state.sessions.length) state.sessions.push({ id: newSessionId(), msgs: [welcome()] })
  if (state.activeId === id) {
    activate(state.sessions[Math.min(idx, state.sessions.length - 1)])
  } else {
    saveSessions()
    renderTabs()
  }
}

// ============================================================================
// 二、聊天
// ============================================================================
const chatInput = $('chatInput')
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto'
  chatInput.style.height = Math.min(chatInput.scrollHeight, 180) + 'px'
})
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
})
$('sendBtn').addEventListener('click', send)
$('newChatBtn').addEventListener('click', createSession)

function renderMsgs() {
  const box = $('messages')
  box.innerHTML = ''
  for (const m of state.msgs) box.appendChild(buildMsg(m.role, m.content, m.error))
  box.scrollTop = box.scrollHeight
}
// Markdown/LaTeX 渲染（render.js 没加载成功时退回转义后的纯文本）
const renderMd = text => {
  if (window.AiRender) return AiRender.render(text == null ? '' : String(text))
  return escapeHtml(String(text == null ? '' : text)).replace(/\n/g, '<br>')
}
// 把渲染结果写进气泡；光标跟在最后一块内容的末尾，不另起一行
function setBody(el, text, cursor) {
  el.innerHTML = renderMd(text)      // render.js 里 markdown-it 以 html:false 运行，模型输出中的尖括号会被转义
  if (cursor) {
    const last = el.lastElementChild
    if (last) last.appendChild(cursor); else el.appendChild(cursor)
  }
}
function buildMsg(role, text, isErr) {
  const wrap = document.createElement('div')
  wrap.className = 'msg ' + (isErr ? 'err' : role)
  const who = document.createElement('div')
  who.className = 'who'
  who.textContent = role === 'user' ? '我' : 'AI'
  const body = document.createElement('div')
  body.className = 'body'
  if (isErr) body.textContent = text   // 错误提示是自家文案，纯文本展示
  else setBody(body, text)
  wrap.appendChild(who); wrap.appendChild(body)
  return wrap
}

async function send() {
  const text = chatInput.value.trim()
  if (!text || state.busy) return
  if (Date.now() > state.expiresAt) return toast('令牌已过期，请重新获取')

  state.busy = true
  $('sendBtn').disabled = true
  chatInput.value = ''
  chatInput.style.height = 'auto'

  const firstAsk = !state.msgs.some(m => m.role === 'user')   // 本窗口第一条提问 → 标签要用它起名
  state.msgs.push({ role: 'user', content: text })
  if (firstAsk) renderTabs()
  const box = $('messages')
  box.appendChild(buildMsg('user', text))
  box.scrollTop = box.scrollHeight

  // 先把空的 AI 气泡放上去，边收边往里填，就是打字机效果
  const bubble = buildMsg('assistant', '')
  const bodyEl = bubble.querySelector('.body')
  const cursor = document.createElement('span')
  cursor.className = 'cursor'
  bodyEl.appendChild(cursor)
  box.appendChild(bubble)
  box.scrollTop = box.scrollHeight

  let answer = ''
  let renderTimer = null
  // 流式增量渲染：90ms 合并一批 delta 重渲染一次；没闭合的公式先按原文显示，闭合后自动成型
  function scheduleRender() {
    if (renderTimer) return
    renderTimer = setTimeout(() => {
      renderTimer = null
      setBody(bodyEl, answer, cursor)
      box.scrollTop = box.scrollHeight
    }, 90)
  }
  try {
    const res = await fetch(BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-ai-token': state.token },
      body: JSON.stringify({ messages: state.msgs.slice(-40) }),
    })

    if (!res.ok) {
      const data = await res.json().catch(() => ({}))
      throw new Error(data.error || `请求失败 (${res.status})`)
    }

    const reader = res.body.getReader()
    const decoder = new TextDecoder()
    let buf = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n')
      buf = lines.pop()               // 最后一段可能被截断，留到下一轮再拼
      for (const line of lines) {
        const s = line.trim()
        if (!s.startsWith('data:')) continue
        const payload = s.slice(5).trim()
        if (payload === '[DONE]') continue
        let delta = ''
        try { delta = JSON.parse(payload)?.choices?.[0]?.delta?.content || '' } catch { continue }
        if (!delta) continue
        answer += delta
        scheduleRender()
      }
    }
    if (!answer) throw new Error('模型没有返回内容，再试一次吧')
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null }
    setBody(bodyEl, answer, cursor)          // 收尾用完整内容再渲染一次
    state.msgs.push({ role: 'assistant', content: answer })
  } catch (e) {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null }
    cursor.remove()
    bodyEl.textContent = ''
    bubble.classList.add('err')
    bodyEl.textContent = '⚠️ ' + e.message
    state.msgs.pop()                  // 失败的那轮不留在上下文里
  } finally {
    cursor.remove()
    saveSessions()
    state.busy = false
    $('sendBtn').disabled = false
    chatInput.focus()
  }
}

// 顶栏：中区显示到期时刻与剩余时间，最右侧挂管理员给这个令牌起的名字
function refreshHeader() {
  const left = state.expiresAt - Date.now()
  $('headCenter').classList.toggle('hidden', !state.token)
  $('headTime').textContent = '有效期至 ' + fmtTime(state.expiresAt)
  const lt = $('headLeft')
  lt.textContent = '剩 ' + fmtLeft(left)
  lt.classList.toggle('warn', left < 3600000)          // 不到 1 小时变黄提醒
  const b = $('userBadge')
  b.classList.toggle('hidden', !state.token || !state.label)
  b.textContent = state.label
}

// ============================================================================
// 三、管理员
// ============================================================================
$('adminLink').addEventListener('click', () => {
  $('adminLogin').classList.toggle('hidden')
  if (!$('adminLogin').classList.contains('hidden')) $('adminUser').focus()
})
$('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin() })
$('adminLoginBtn').addEventListener('click', adminLogin)

async function adminLogin() {
  const user = $('adminUser').value.trim()
  const pass = $('adminPass').value
  if (!user || !pass) return toast('请输入用户名和密码')
  $('adminLoginBtn').disabled = true
  try {
    const data = await api('/api/login', { method: 'POST', headers: { 'x-user': user, 'x-password': pass } })
    state.adminUser = data.username
    state.adminPass = pass
    $('logoutBtn').classList.remove('hidden')
    $('logoutBtn').textContent = '退出 ' + state.adminUser
    showView('admin')
    loadTokens()
  } catch (e) {
    toast('❌ ' + e.message)
  } finally {
    $('adminLoginBtn').disabled = false
  }
}
$('logoutBtn').addEventListener('click', () => {
  state.adminUser = ''; state.adminPass = ''; state.token = ''
  state.sessions = []; state.activeId = ''; state.msgs = []
  $('logoutBtn').classList.add('hidden')
  $('userBadge').classList.add('hidden')
  $('headCenter').classList.add('hidden')
  showView('gate')
})

const adminHeaders = () => ({ 'x-user': state.adminUser, 'x-password': state.adminPass })

async function loadTokens() {
  $('tokSub').textContent = '加载中…'
  try {
    const data = await api('/api/tokens', { headers: adminHeaders() })
    const list = $('tokList')
    list.innerHTML = ''
    if (!data.tokens.length) {
      list.innerHTML = '<div class="empty">还没有生效中的令牌</div>'
    } else {
      for (const t of data.tokens) list.appendChild(buildTok(t))
    }
    $('tokSub').textContent = `共 ${data.tokens.length} 个 · 每个令牌最多可聊 ${data.maxCalls} 次`
  } catch (e) {
    $('tokSub').textContent = '加载失败：' + e.message
  }
}
function buildTok(t) {
  const el = document.createElement('div')
  el.className = 'tok'

  const code = document.createElement('div')
  code.className = 'code'
  code.textContent = t.display

  const meta = document.createElement('div')
  meta.className = 'meta'
  const left = t.expiresAt - Date.now()
  meta.innerHTML = `<b>${t.label ? escapeHtml(t.label) : '未命名'}</b> · 剩 ${fmtLeft(left)}<br>`
    + `已用 ${t.calls} 次${t.lastUsedAt ? ' · 最近 ' + fmtTime(t.lastUsedAt) : ''}`

  const copy = document.createElement('button')
  copy.className = 'btn-ghost'
  copy.textContent = '复制'
  copy.onclick = () => copyText(t.display)

  const revoke = document.createElement('button')
  revoke.className = 'btn-danger'
  revoke.textContent = '关闭'
  revoke.onclick = () => revokeToken(t)

  el.appendChild(code); el.appendChild(meta); el.appendChild(copy); el.appendChild(revoke)
  return el
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

$('createBtn').addEventListener('click', async () => {
  $('createBtn').disabled = true
  try {
    const data = await api('/api/tokens', {
      method: 'POST',
      headers: adminHeaders(),
      body: { label: $('newLabel').value.trim(), hours: Number($('newHours').value) },
    })
    $('newTokenCode').textContent = data.display
    $('newTokenBox').classList.remove('hidden')
    $('newTokenBox').dataset.token = data.display
    $('newLabel').value = ''
    loadTokens()
  } catch (e) {
    toast('❌ ' + e.message)
  } finally {
    $('createBtn').disabled = false
  }
})
$('copyNewBtn').addEventListener('click', () => copyText($('newTokenBox').dataset.token || ''))
$('copyLinkBtn').addEventListener('click', () => {
  // 令牌塞进 URL hash —— hash 不会发给服务器，不会被日志记下来
  copyText(`${location.origin}/#${($('newTokenBox').dataset.token || '').replace(/-/g, '')}`)
})
$('refreshBtn').addEventListener('click', loadTokens)

async function revokeToken(t) {
  if (!confirm(`确定关闭「${t.label || '未命名'}」这个令牌吗？\n对方会立刻用不了，且无法恢复。`)) return
  try {
    await api('/api/tokens/revoke', { method: 'POST', headers: adminHeaders(), body: { token: t.token } })
    toast('已关闭')
    loadTokens()
  } catch (e) {
    toast('❌ ' + e.message)
  }
}

// ============================================================================
// 启动：支持邀请链接 #令牌，直接进聊天
// ============================================================================
;(function boot() {
  setInterval(() => { if (state.token) refreshHeader() }, 30000)
  const hash = location.hash.replace(/[^A-Za-z2-9]/g, '')
  if (hash.length === 16) {
    $('tokenInput').value = hash.toUpperCase().match(/.{1,4}/g).join('-')
    history.replaceState(null, '', location.pathname)   // 用完就把令牌从地址栏抹掉
    enterChat()
  } else {
    $('tokenInput').focus()
  }
})()
</script>
</body>
</html>
